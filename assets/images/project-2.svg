<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="shopifyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08140c"/>
      <stop offset="50%" stop-color="#0f2618"/>
      <stop offset="100%" stop-color="#050d08"/>
    </linearGradient>
    <linearGradient id="shopifyGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#95bf47"/>
      <stop offset="100%" stop-color="#5e8e3e"/>
    </linearGradient>
    <linearGradient id="glowBag" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#shopifyBg)"/>

  <!-- Subtle Glow -->
  <circle cx="400" cy="220" r="180" fill="#95bf47" opacity="0.08" filter="blur(50px)"/>

  <!-- Browser Window Mockup Frame -->
  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="#0d1810" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="680" height="42" rx="12" fill="#14261a"/>
    <rect y="30" width="680" height="12" fill="#14261a"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>

    <!-- URL Bar -->
    <rect x="90" y="11" width="370" height="20" rx="10" fill="#09120b"/>
    <text x="110" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://shop-vogue.myshopify.com (Shopify Liquid Store)</text>

    <!-- Top Shopify Storefront Header -->
    <rect x="0" y="42" width="680" height="30" fill="#0a140d"/>
    <!-- Shopify Bag Icon -->
    <g transform="translate(25, 48)">
      <path d="M 10 3 L 5 7 L 5 18 L 19 18 L 19 7 L 14 3 Z" fill="#95bf47"/>
      <path d="M 9 6 C 9 4 15 4 15 6" stroke="#ffffff" stroke-width="1.5" fill="none"/>
      <text x="9" y="15" fill="#ffffff" font-family="sans-serif" font-size="8" font-weight="900">S</text>
    </g>
    <text x="50" y="62" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AURA LIFESTYLE</text>
    <text x="200" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">New In &bull; Apparel &bull; Accessories &bull; Sale</text>
    <rect x="585" y="47" width="75" height="20" rx="10" fill="#1b3823"/>
    <text x="597" y="61" fill="#95bf47" font-family="system-ui, sans-serif" font-size="10" font-weight="700">🛒 Cart (3)</text>

    <!-- Hero Promotional Banner -->
    <g transform="translate(25, 85)">
      <rect width="630" height="115" rx="8" fill="#162e1e" stroke="#264e33" stroke-width="1"/>
      <text x="30" y="125" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="900">SUMMER DROP &bull; UP TO 40% OFF</text>
      <text x="30" y="150" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="12">Mobile-optimized Shopify checkout flow with instant conversion triggers</text>
      <rect x="30" y="165" width="130" height="25" rx="4" fill="#95bf47"/>
      <text x="50" y="182" fill="#052e16" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Shop The Drop ➔</text>
    </g>

    <!-- Product Grid Showcase -->
    <!-- Product 1 -->
    <g transform="translate(25, 215)">
      <rect width="195" height="185" rx="8" fill="#14261a" stroke="#264e33" stroke-width="1"/>
      <rect x="15" y="12" width="165" height="95" rx="6" fill="#0a140d"/>
      <circle cx="97" cy="60" r="28" fill="url(#glowBag)" opacity="0.85"/>
      <text x="15" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Minimalist Leather Tote</text>
      <text x="15" y="146" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="800">$128.00</text>
      <text x="68" y="146" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-decoration="line-through">$160.00</text>
      <rect x="15" y="155" width="165" height="22" rx="4" fill="#95bf47"/>
      <text x="62" y="170" fill="#052e16" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Quick Add +</text>
    </g>

    <!-- Product 2 -->
    <g transform="translate(242, 215)">
      <rect width="195" height="185" rx="8" fill="#14261a" stroke="#264e33" stroke-width="1"/>
      <rect x="15" y="12" width="165" height="95" rx="6" fill="#0a140d"/>
      <rect x="68" y="35" width="55" height="50" rx="8" fill="#3b82f6" opacity="0.8"/>
      <text x="15" y="128" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Aero Chrono Watch</text>
      <text x="15" y="146" fill="#34d399" font-family="system-ui, sans-serif" font-size="12" font-weight="800">$215.00</text>
      <rect x="15" y="155" width="165" height="22" rx="4" fill="#95bf47"/>
      <text x="62" y="170" fill="#052e16" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Quick Add +</text>
    </g>

    <!-- Side Slide-Out Cart / Upsell Drawer Simulation -->
    <g transform="translate(460, 215)">
      <rect width="195" height="185" rx="8" fill="#112217" stroke="#22c55e" stroke-width="1"/>
      <text x="15" y="24" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800">⚡ SHOPIFY CHECKOUT LIFT</text>
      
      <rect x="15" y="35" width="165" height="42" rx="4" fill="#0a140d"/>
      <text x="22" y="52" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Conversion Rate</text>
      <text x="140" y="52" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="800">+31.8%</text>
      <text x="22" y="68" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Liquid section speed boost</text>

      <rect x="15" y="85" width="165" height="42" rx="4" fill="#0a140d"/>
      <text x="22" y="102" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Cart Abandonment</text>
      <text x="145" y="102" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="800">-22%</text>
      <text x="22" y="118" fill="#64748b" font-family="system-ui, sans-serif" font-size="9">Frictionless slide cart</text>

      <rect x="15" y="138" width="165" height="35" rx="6" fill="url(#shopifyGreen)"/>
      <text x="45" y="160" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Express Checkout ➔</text>
    </g>
  </g>
</svg>
