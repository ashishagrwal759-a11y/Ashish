<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="b2bBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071217"/>
      <stop offset="50%" stop-color="#0f2630"/>
      <stop offset="100%" stop-color="#060c10"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="goldTag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#b2bBg)"/>

  <!-- Browser Window Mockup Frame -->
  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="#0c171d" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="680" height="42" rx="12" fill="#13242e"/>
    <rect y="30" width="680" height="12" fill="#13242e"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>

    <!-- URL Bar -->
    <rect x="90" y="11" width="370" height="20" rx="10" fill="#0a1217"/>
    <text x="110" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://wholesale-direct.store (Shopify B2B Multi-Tier Portal)</text>

    <!-- Top Store Header -->
    <rect x="0" y="42" width="680" height="30" fill="#081014"/>
    <text x="25" y="62" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="800">GLOBAL HARDWARE B2B</text>
    <rect x="230" y="48" width="105" height="18" rx="4" fill="#0f2733"/>
    <text x="240" y="61" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">✓ WHOLESALE TIER ACTIVE</text>
    <text x="360" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Catalog &bull; Quick Order by SKU &bull; Invoices</text>
    <rect x="575" y="48" width="85" height="18" rx="9" fill="url(#tealGrad)"/>
    <text x="590" y="61" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Quick PO Entry</text>

    <!-- Main Content: Tiered Volume Pricing Table -->
    <g transform="translate(25, 85)">
      <rect width="400" height="235" rx="8" fill="#101f28" stroke="#1d3849" stroke-width="1"/>
      <text x="20" y="30" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Industrial IoT Sensors (SKU: SEN-402)</text>
      <text x="20" y="48" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Dynamic Liquid variant pricing table calculated via Shopify Cart API</text>

      <!-- Table Header -->
      <rect x="20" y="65" width="360" height="26" rx="4" fill="#172e3c"/>
      <text x="30" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Order Quantity</text>
      <text x="160" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Unit Price</text>
      <text x="270" y="82" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Savings %</text>

      <!-- Row 1 -->
      <text x="30" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">1 – 24 Units</text>
      <text x="160" y="112" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10">$89.00 / ea</text>
      <text x="270" y="112" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">Standard</text>
      <line x1="20" y1="124" x2="380" y2="124" stroke="#1d3849"/>

      <!-- Row 2 -->
      <text x="30" y="145" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">25 – 99 Units</text>
      <text x="160" y="145" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10">$68.00 / ea</text>
      <text x="270" y="145" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10">Save 23%</text>
      <line x1="20" y1="157" x2="380" y2="157" stroke="#1d3849"/>

      <!-- Row 3: Active Tier -->
      <rect x="20" y="162" width="360" height="30" rx="4" fill="#143b48" stroke="#0ea5e9" stroke-width="1"/>
      <text x="30" y="181" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">100+ Units (Your Tier)</text>
      <text x="160" y="181" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800">$49.50 / ea</text>
      <text x="270" y="181" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Save 44%</text>

      <rect x="20" y="200" width="360" height="24" rx="4" fill="#0d181e"/>
      <text x="30" y="216" fill="#10b981" font-family="system-ui, sans-serif" font-size="9">✓ In Stock (2,450 units) &bull; Net-30 Invoicing eligible</text>
    </g>

    <!-- Side B2B Performance Stats -->
    <g transform="translate(440, 85)">
      <rect width="215" height="235" rx="8" fill="#101f28" stroke="#1d3849" stroke-width="1"/>
      <text x="18" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">B2B COMMERCE METRICS</text>

      <rect x="18" y="42" width="180" height="48" rx="6" fill="#091217"/>
      <text x="26" y="62" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Bulk Order Velocity</text>
      <text x="26" y="80" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="800">+45% Reorder Rate</text>

      <rect x="18" y="98" width="180" height="48" rx="6" fill="#091217"/>
      <text x="26" y="118" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">Order Accuracy</text>
      <text x="26" y="136" fill="#10b981" font-family="system-ui, sans-serif" font-size="15" font-weight="800">99.7% with SKU input</text>

      <rect x="18" y="154" width="180" height="60" rx="6" fill="url(#tealGrad)"/>
      <text x="28" y="178" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Generate Quote ➔</text>
      <text x="28" y="198" fill="#e0f2fe" font-family="system-ui, sans-serif" font-size="9">Instant PDF spec download</text>
    </g>

    <!-- Bottom Features Strip -->
    <g transform="translate(25, 330)">
      <rect width="630" height="68" rx="8" fill="#101f28" stroke="#1d3849" stroke-width="1"/>
      <text x="20" y="26" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Technical Implementation Highlights:</text>
      <text x="20" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">✓ Custom Shopify Liquid templates with tiered volume pricing tables &bull; Customer Tag gating</text>
      <text x="20" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">✓ Automated tax exemptions &bull; 3PL warehouse inventory sync &bull; Net-30 payment terms integration</text>
    </g>
  </g>
</svg>
