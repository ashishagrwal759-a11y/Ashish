<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="reBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1c"/>
      <stop offset="50%" stop-color="#141c38"/>
      <stop offset="100%" stop-color="#070914"/>
    </linearGradient>
    <linearGradient id="reAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="goldStatus" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#reBg)"/>

  <!-- Browser Window Mockup Frame -->
  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="#0d1424" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="680" height="42" rx="12" fill="#141e33"/>
    <rect y="30" width="680" height="12" fill="#141e33"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>

    <!-- URL Bar -->
    <rect x="90" y="11" width="370" height="20" rx="10" fill="#0a0f1d"/>
    <text x="110" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://prime-estates.com/properties (WordPress ACF &amp; Booking)</text>

    <!-- Top WordPress Header -->
    <rect x="0" y="42" width="680" height="30" fill="#0b1120"/>
    <circle cx="25" cy="56" r="8" fill="#21759b"/>
    <text x="21" y="60" fill="#ffffff" font-family="Georgia, serif" font-weight="bold" font-size="10">W</text>
    <text x="40" y="61" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">PRIME ESTATES &amp; RESIDENCES</text>
    <text x="250" y="61" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Search &bull; Featured Listings &bull; Virtual Tours &bull; Schedule Visit</text>
    <rect x="580" y="47" width="80" height="20" rx="10" fill="#1e3a8a"/>
    <text x="592" y="61" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Book Tour</text>

    <!-- Interactive Property Search Filter Bar (ACF powered) -->
    <g transform="translate(25, 82)">
      <rect width="630" height="45" rx="8" fill="#131e36" stroke="#25355a" stroke-width="1"/>
      <rect x="15" y="10" width="140" height="25" rx="4" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="25" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">📍 Location / City</text>
      
      <rect x="165" y="10" width="130" height="25" rx="4" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="175" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">💰 Price Range: $500k+</text>

      <rect x="305" y="10" width="130" height="25" rx="4" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="315" y="26" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">🏡 Bedrooms: 3 - 5</text>

      <rect x="445" y="10" width="170" height="25" rx="4" fill="url(#reAccent)"/>
      <text x="480" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Search Listings (48)</text>
    </g>

    <!-- Main Grid: Listing Card 1 + Appointment Booking Box -->
    <!-- Listing Card 1 -->
    <g transform="translate(25, 140)">
      <rect width="320" height="255" rx="8" fill="#131e36" stroke="#25355a" stroke-width="1"/>
      <!-- Property Image Mockup -->
      <rect x="15" y="15" width="290" height="120" rx="6" fill="#0b1120"/>
      <!-- Architecture Graphic -->
      <polygon points="160,35 70,85 250,85" fill="#1e3a8a" opacity="0.6"/>
      <rect x="95" y="85" width="130" height="40" fill="#172554"/>
      <text x="25" y="32" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="800">FEATURED LISTING</text>
      
      <text x="15" y="155" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="800">The Grandview Penthouse Suite</text>
      <text x="15" y="172" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">4 Beds &bull; 3.5 Baths &bull; 3,450 sq.ft &bull; Skyline Views</text>
      <text x="15" y="196" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="900">$1,450,000</text>
      
      <rect x="15" y="210" width="140" height="30" rx="4" fill="#2563eb"/>
      <text x="35" y="229" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Schedule Tour</text>

      <rect x="165" y="210" width="140" height="30" rx="4" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="185" y="229" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" font-weight="600">WhatsApp Inquiry</text>
    </g>

    <!-- Side Booking Widget & WordPress Features -->
    <g transform="translate(360, 140)">
      <rect width="295" height="255" rx="8" fill="#131e36" stroke="#25355a" stroke-width="1"/>
      <text x="18" y="28" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Direct Visit Calendar Integration</text>
      <text x="18" y="45" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Automated Google Calendar &amp; Email Sync</text>

      <!-- Calendar Strip -->
      <g transform="translate(18, 55)">
        <rect width="45" height="42" rx="4" fill="#1e293b"/>
        <text x="15" y="18" fill="#94a3b8" font-size="9">Mon</text>
        <text x="15" y="34" fill="#f8fafc" font-size="11" font-weight="700">12</text>

        <rect x="52" y="0" width="45" height="42" rx="4" fill="#1e293b"/>
        <text x="67" y="18" fill="#94a3b8" font-size="9">Tue</text>
        <text x="67" y="34" fill="#f8fafc" font-size="11" font-weight="700">13</text>

        <rect x="104" y="0" width="45" height="42" rx="4" fill="#2563eb"/>
        <text x="119" y="18" fill="#93c5fd" font-size="9">Wed</text>
        <text x="119" y="34" fill="#ffffff" font-size="11" font-weight="700">14</text>

        <rect x="156" y="0" width="45" height="42" rx="4" fill="#1e293b"/>
        <text x="171" y="18" fill="#94a3b8" font-size="9">Thu</text>
        <text x="171" y="34" fill="#f8fafc" font-size="11" font-weight="700">15</text>

        <rect x="208" y="0" width="45" height="42" rx="4" fill="#1e293b"/>
        <text x="223" y="18" fill="#94a3b8" font-size="9">Fri</text>
        <text x="223" y="34" fill="#f8fafc" font-size="11" font-weight="700">16</text>
      </g>

      <rect x="18" y="112" width="258" height="60" rx="6" fill="#0b1120" stroke="#334155" stroke-width="1"/>
      <text x="28" y="132" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Active Time Slots (Wed, 14th):</text>
      <text x="28" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="9">10:00 AM &bull; 02:00 PM &bull; 04:30 PM (Private Guided Walk)</text>

      <!-- Key WordPress Development Highlights -->
      <g transform="translate(18, 185)">
        <text x="0" y="15" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" font-weight="700">✓ Advanced Custom Fields (ACF Pro) Data Model</text>
        <text x="0" y="32" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">✓ Google Maps API Pin Integration</text>
        <text x="0" y="48" fill="#34d399" font-family="system-ui, sans-serif" font-size="10">✓ Zero-Spam Recaptcha v3 Form Security</text>
      </g>
    </g>
  </g>
</svg>
