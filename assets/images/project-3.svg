<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="salesBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0a1a"/>
      <stop offset="50%" stop-color="#191336"/>
      <stop offset="100%" stop-color="#070612"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#salesBg)"/>
  <circle cx="400" cy="200" r="180" fill="#a855f7" opacity="0.1" filter="blur(40px)"/>

  <!-- Browser Window Mockup Frame -->
  <g transform="translate(60, 40)">
    <rect width="680" height="420" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="680" height="42" rx="12" fill="#1e293b"/>
    <rect y="30" width="680" height="12" fill="#1e293b"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>

    <!-- URL Bar -->
    <rect x="90" y="11" width="370" height="20" rx="10" fill="#0f172a"/>
    <text x="110" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://grow-consult.com/scale (B2B Lead Funnel - Recent 3M)</text>

    <!-- Header Pitch -->
    <text x="340" y="80" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle">Turn Cold Traffic Into High-Value Retainer Clients</text>
    <text x="340" y="102" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" text-anchor="middle">Engineered with multi-step lead qualification and consultative sales psychology</text>

    <!-- 2-Step Lead Capture Form -->
    <g transform="translate(40, 125)">
      <rect width="330" height="255" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="25" y="32" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="14" font-weight="800">Claim 1-on-1 Growth Audit</text>
      <text x="25" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Step 1 of 2 &bull; Pre-qualify your business size</text>

      <rect x="25" y="65" width="280" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="35" y="85" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Business / Corporate Email</text>

      <rect x="25" y="108" width="280" height="32" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="35" y="128" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Current Monthly Revenue Range</text>

      <rect x="25" y="152" width="280" height="42" rx="6" fill="url(#purpleGrad)"/>
      <text x="165" y="178" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Book 15-Min Strategy Session ➔</text>
      
      <text x="165" y="215" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">🔒 Zero risk &bull; Guaranteed confidentiality &bull; Fast routing</text>
      <text x="165" y="235" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Integrated with HubSpot CRM &amp; automated calendar booking</text>
    </g>

    <!-- Analytics Dashboard Box -->
    <g transform="translate(395, 125)">
      <rect width="245" height="255" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="32" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Conversion &amp; Pipeline Analytics</text>
      
      <!-- Metrics Bars -->
      <text x="20" y="62" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Visitor Impressions</text>
      <text x="205" y="62" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">14,200</text>
      <rect x="20" y="70" width="205" height="8" rx="4" fill="#334155"/>
      <rect x="20" y="70" width="205" height="8" rx="4" fill="#38bdf8"/>

      <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Qualified Quiz Starts</text>
      <text x="205" y="102" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">5,820</text>
      <rect x="20" y="110" width="205" height="8" rx="4" fill="#334155"/>
      <rect x="20" y="110" width="135" height="8" rx="4" fill="#818cf8"/>

      <text x="20" y="142" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Consultation Bookings</text>
      <text x="205" y="142" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="700">1,510</text>
      <rect x="20" y="150" width="205" height="8" rx="4" fill="#334155"/>
      <rect x="20" y="150" width="85" height="8" rx="4" fill="url(#barGrad)"/>

      <!-- Highlighted Stat Box -->
      <rect x="20" y="180" width="205" height="55" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="35" y="204" fill="#a855f7" font-family="system-ui, sans-serif" font-size="20" font-weight="900">26.0%</text>
      <text x="35" y="222" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Avg Qualified Form Conversion Rate</text>
    </g>
  </g>
</svg>
