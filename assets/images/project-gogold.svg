<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="ggBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18"/>
      <stop offset="50%" stop-color="#0d1b32"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <linearGradient id="goldLuxury" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>

    <linearGradient id="usNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#ggBg)"/>

  <!-- Subtle Constellation / Grid Effect -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800 M0 350 H800 M0 400 H800 M0 450 H800"/>
    <path d="M50 0 V500 M100 0 V500 M150 0 V500 M200 0 V500 M250 0 V500 M300 0 V500 M350 0 V500 M400 0 V500 M450 0 V500 M500 0 V500 M550 0 V500 M600 0 V500 M650 0 V500 M700 0 V500 M750 0 V500"/>
  </g>

  <!-- Ambient Glow in Center -->
  <circle cx="400" cy="220" r="180" fill="#d4af37" opacity="0.08" filter="blur(60px)"/>

  <!-- Browser Window Mockup Frame -->
  <g transform="translate(60, 40)">
    <!-- Shell -->
    <rect width="680" height="420" rx="12" fill="#0b1322" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
    
    <!-- Titlebar -->
    <rect width="680" height="42" rx="12" fill="#142138"/>
    <rect y="30" width="680" height="12" fill="#142138"/>
    <circle cx="25" cy="21" r="5" fill="#ef4444"/>
    <circle cx="42" cy="21" r="5" fill="#eab308"/>
    <circle cx="59" cy="21" r="5" fill="#22c55e"/>

    <!-- URL Bar -->
    <rect x="90" y="11" width="370" height="20" rx="10" fill="#080e1a"/>
    <text x="110" y="25" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">https://gogoldusa.com (WordPress Full Redesign)</text>

    <!-- Top Navigation Bar of the Redesigned Site -->
    <rect x="0" y="42" width="680" height="36" fill="#0a1220"/>
    
    <!-- Brand Logo: GOGOLD USA -->
    <g transform="translate(25, 48)">
      <circle cx="12" cy="12" r="10" fill="url(#goldLuxury)"/>
      <text x="7" y="16" fill="#0b1322" font-family="system-ui, sans-serif" font-weight="900" font-size="11">G</text>
      <text x="28" y="16" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="800" font-size="12" letter-spacing="1">GOGOLD</text>
      <text x="88" y="16" fill="url(#goldLuxury)" font-family="system-ui, sans-serif" font-weight="900" font-size="12">USA</text>
    </g>

    <text x="230" y="64" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">U.S. Relocation &bull; Visa Pathways &bull; Business Launch &bull; Settlement</text>
    
    <rect x="545" y="48" width="115" height="24" rx="12" fill="url(#goldLuxury)"/>
    <text x="557" y="64" fill="#0b1322" font-family="system-ui, sans-serif" font-size="10" font-weight="800">Book Consultation</text>

    <!-- Hero Section Banner Inside Redesign -->
    <g transform="translate(25, 90)">
      <rect width="630" height="135" rx="8" fill="#111c33" stroke="#23355b" stroke-width="1"/>
      
      <!-- Flag / Star Badge -->
      <rect x="25" y="20" width="180" height="18" rx="9" fill="rgba(212,175,55,0.15)" stroke="rgba(212,175,55,0.4)" stroke-width="1"/>
      <text x="35" y="33" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9" font-weight="700">★ STRATEGIC U.S. RELOCATION</text>

      <text x="25" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="900">Your Trusted Roadmap to the United States</text>
      <text x="25" y="88" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Guiding international founders, executives, investors &amp; families through seamless U.S. settlement</text>
      
      <rect x="25" y="100" width="150" height="26" rx="4" fill="url(#goldLuxury)"/>
      <text x="40" y="117" fill="#0b1322" font-family="system-ui, sans-serif" font-size="10" font-weight="800">Explore Pathways ➔</text>

      <rect x="185" y="100" width="130" height="26" rx="4" fill="#0a1220" stroke="#334155" stroke-width="1"/>
      <text x="202" y="117" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="10" font-weight="600">Client Stories</text>
    </g>

    <!-- Three Pillars Service Cards in Redesign -->
    <!-- Card 1: Immigration Pathways -->
    <g transform="translate(25, 238)">
      <rect width="195" height="160" rx="8" fill="#0f192d" stroke="#23355b" stroke-width="1"/>
      <circle cx="35" cy="35" r="14" fill="rgba(212,175,55,0.2)"/>
      <text x="28" y="40" fill="#fbbf24" font-size="14">🏛️</text>
      <text x="20" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Visa Pathway Guidance</text>
      <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Structured roadmap for investor,</text>
      <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">executive, and talent visas.</text>
      <rect x="20" y="122" width="155" height="22" rx="4" fill="#172744"/>
      <text x="45" y="137" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Learn More &bull; WordPress</text>
    </g>

    <!-- Card 2: Business Expansion -->
    <g transform="translate(242, 238)">
      <rect width="195" height="160" rx="8" fill="#0f192d" stroke="#23355b" stroke-width="1"/>
      <circle cx="35" cy="35" r="14" fill="rgba(56,189,248,0.2)"/>
      <text x="28" y="40" fill="#38bdf8" font-size="14">🚀</text>
      <text x="20" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Business &amp; Startups</text>
      <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Entity incorporation, U.S. market</text>
      <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">expansion &amp; compliance setup.</text>
      <rect x="20" y="122" width="155" height="22" rx="4" fill="#172744"/>
      <text x="45" y="137" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Explore Setup &bull; ACF Pro</text>
    </g>

    <!-- Card 3: Relocation Logistics -->
    <g transform="translate(460, 238)">
      <rect width="195" height="160" rx="8" fill="#0f192d" stroke="#23355b" stroke-width="1"/>
      <circle cx="35" cy="35" r="14" fill="rgba(16,185,129,0.2)"/>
      <text x="28" y="40" fill="#10b981" font-size="14">🏡</text>
      <text x="20" y="70" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">Settlement &amp; Logistics</text>
      <text x="20" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Banking, housing, schooling,</text>
      <text x="20" y="102" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">healthcare &amp; tax frameworks.</text>
      <rect x="20" y="122" width="155" height="22" rx="4" fill="#172744"/>
      <text x="45" y="137" fill="#10b981" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Schedule Call &bull; Intake</text>
    </g>
  </g>
</svg>
